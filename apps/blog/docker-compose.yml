# Portainer stack for apps/blog (phase 1 of the Vercel exit).
# Pulls a prebuilt image from GHCR and runs it — the home server never builds.
# Ingress: the existing nginx-proxy-manager forwards <public-host> -> <server-lan-ip>:3000
# and terminates TLS (Let's Encrypt). No cloudflared needed.
services:
  blog:
    image: ghcr.io/wannysim/mumak-blog:latest # pin :<sha> for deterministic rollbacks
    container_name: mumak-blog
    restart: unless-stopped
    # Cap memory so a leak/spike OOM-kills THIS container (restart policy revives it)
    # instead of letting the kernel pick a random victim (NPM/adguard) on a ~1GB-free box.
    # Steady-state RSS is a few hundred MB; 768m leaves headroom for sharp bursts.
    mem_limit: 768m
    # Rotate stdout logs — the default json-file driver grows unbounded and a full
    # disk takes every container on the host down with it.
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    labels:
      # Opt-in for the autoheal sidecar below: restart when the healthcheck flips
      # to unhealthy. `restart: unless-stopped` only covers process EXIT — a hung
      # Node (event-loop block, GC thrash) stays "running" forever without this.
      autoheal: 'true'
    ports:
      - '3100:3000' # host:container — NPM proxies to the host's :3100 (host 3000 is taken by adguard's host-network web UI)
    environment:
      NODE_ENV: production
      # Keep the V8 heap comfortably under mem_limit so GC kicks in before the
      # kernel OOM-killer does — a GC pause is recoverable, a SIGKILL is not.
      NODE_OPTIONS: --max-old-space-size=512
      # PORT / HOSTNAME are already baked into the image (3000 / 0.0.0.0).
      # Runtime-only server secrets — safe to change without a rebuild.
      # Leave unset and the now-playing widget just no-ops.
      SPOTIFY_CLIENT_ID: ${SPOTIFY_CLIENT_ID:-}
      SPOTIFY_CLIENT_SECRET: ${SPOTIFY_CLIENT_SECRET:-}
      SPOTIFY_REFRESH_TOKEN: ${SPOTIFY_REFRESH_TOKEN:-}
      # DO NOT put NEXT_PUBLIC_* here — they are inlined at build time; setting them
      # here does nothing. DO NOT set VERCEL_ENV (analytics auto-disables off Vercel).
    volumes:
      # Persist the optimized-image / 'use cache' output across restarts.
      # NOTE: this is NOT the future image-UPLOAD store — that gets its own volume.
      - blog_next_cache:/app/apps/blog/.next/cache
    healthcheck:
      # slim image has no curl — use node fetch. Hit a stable 200 route, not "/"
      # ("/" 307-redirects to /ko|/en because localePrefix is 'always').
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/ko/blog').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    # Seams for later phases (do not build now):
    # depends_on: [postgres] # when a DB phase lands (reuse the existing postgres:16)

  # Docker healthchecks only LABEL a container unhealthy — nothing acts on it.
  # autoheal closes that loop: it watches containers carrying the autoheal label
  # and restarts them once they flip unhealthy (~90s with the check above).
  # ponytail: restart-on-unhealthy is symptom relief; error tracking (GlitchTip)
  # owns finding the root cause.
  autoheal:
    image: willfarrell/autoheal:1.2.0
    container_name: mumak-blog-autoheal
    restart: unless-stopped
    environment:
      AUTOHEAL_CONTAINER_LABEL: autoheal
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    logging:
      driver: json-file
      options:
        max-size: 5m
        max-file: '2'

volumes:
  blog_next_cache:
