<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Vaundy 노래방</title>
    <meta name="description" content="Vaundy 곡을 일본어·발음·번역 가사와 함께 따라 부르는 모바일 노래방" />

    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icons/icon-192.png" type="image/png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="노래방" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#e9edf0" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#15171b" />

    <link rel="preconnect" href="https://www.youtube.com" />
    <link rel="preconnect" href="https://i.ytimg.com" />

    <!--
      React가 마운트되기 전에 테마를 확정한다. 이 스크립트가 없으면 첫 페인트가 밝은 기본
      배경으로 나갔다가 다크로 바뀌면서 깜빡인다. 동기 스크립트라 파싱을 막고 페인트보다 먼저 돈다.
      판단 규칙은 src/components/theme-provider.tsx와 같아야 한다 (키·저장값·기기 설정 순).
    -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('karaoke:theme');
          var theme =
            stored === 'dark' || stored === 'light'
              ? stored
              : window.matchMedia('(prefers-color-scheme: dark)').matches
                ? 'dark'
                : 'light';
          document.documentElement.classList.add(theme);
          document.documentElement.style.colorScheme = theme;
        } catch (error) {
          /* localStorage가 막힌 환경(사파리 프라이빗 등)에서는 기본값으로 둔다 */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
