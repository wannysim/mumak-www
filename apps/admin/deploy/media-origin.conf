server {
  listen 8080;
  server_name _;
  server_tokens off;
  autoindex off;
  disable_symlinks on;

  if ($request_method !~ "^(GET|HEAD)$") {
    return 405;
  }

  if ($is_args != "") {
    return 404;
  }

  location = /healthz {
    access_log off;
    return 204;
  }

  location ~ "^/blog/[0-9a-f]{64}/content-v[1-9][0-9]*/image\.jpg$" {
    if ($request_uri !~ "^/blog/[0-9a-f]{64}/content-v[1-9][0-9]*/image\.jpg$") {
      return 404;
    }
    root /srv/media;
    try_files $uri =404;
    default_type image/jpeg;
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header X-Content-Type-Options nosniff;
  }

  location ~ "^/blog/[0-9a-f]{64}/content-v[1-9][0-9]*/image\.webp$" {
    if ($request_uri !~ "^/blog/[0-9a-f]{64}/content-v[1-9][0-9]*/image\.webp$") {
      return 404;
    }
    root /srv/media;
    try_files $uri =404;
    default_type image/webp;
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header X-Content-Type-Options nosniff;
  }

  location / {
    return 404;
  }
}
