packages:
  - apps/*
  - packages/*
pmOnFail: download
overrides:
  '@axe-core/playwright>playwright-core': 1.63.0
  '@types/react': 19.3.0
  '@types/react-dom': 19.3.0
  'brace-expansion@>=5.0.0 <5.0.8': 5.0.8
  jest-mock: ^30.4.1
  'next>postcss': 8.5.23
  react-kapsule: 2.6.0
  react-native-worklets: 0.10.0
allowBuilds:
  '@parcel/watcher': false
  # sentry-cli 바이너리는 소스맵 업로드용 — 안 쓰므로 다운로드 자체를 막는다.
  '@sentry/cli': false
  '@swc/core': false
  esbuild: false
  msgpackr-extract: false
  msw: false
  sharp: false
  unrs-resolver: false
patchedDependencies:
  '@dnd-kit/dom@0.5.0': patches/@dnd-kit__dom@0.5.0.patch
