packages:
  - apps/*
  - packages/*
pmOnFail: download
overrides:
  '@axe-core/playwright>playwright-core': 1.64.1
  '@types/react': 19.3.0
  '@types/react-dom': 19.3.0
  'brace-expansion@>=1.0.0 <1.1.21': 1.1.21
  'brace-expansion@>=2.0.0 <2.1.7': 2.1.7
  'brace-expansion@>=5.0.0 <5.0.12': 5.0.12
  'compression@>=1.0.0 <1.8.2': 1.8.2
  'ip-address@>=10.0.0 <10.7.4': 10.7.4
  'postcss-selector-parser@>=6.0.0 <6.1.5': 6.1.5
  'zod@>=4.0.0 <4.6.7': 4.6.7
  jest-mock: ^30.4.1
  'next>postcss': 8.5.23
  react-kapsule: 2.6.0
  react-native-worklets: 0.10.0
allowBuilds:
  '@parcel/watcher': false
  # sentry-cli 바이너리는 소스맵 업로드용 — 안 쓰므로 다운로드 자체를 막는다.
  '@sentry/cli': false
  '@swc/core': false
  esbuild: false
  msgpackr-extract: false
  msw: false
  sharp: false
  unrs-resolver: false
patchedDependencies:
  '@dnd-kit/dom@0.5.0': patches/@dnd-kit__dom@0.5.0.patch
