name: "Detect Changed Apps"
description: "Detect which apps have changed based on git diff or manual input"

inputs:
  manual_scopes:
    description: "Comma-separated list of app names to include (overrides auto-detection)"
    required: false
  changed_files:
    description: "Optional: changed files list (space or newline separated)"
    required: false
  base_ref:
    description: "Base ref for comparison (default: HEAD~1 for push, base ref for PR)"
    required: false
  apps_config:
    description: "Path to apps config file"
    required: false
    default: ".github/app-config/apps.yml"

outputs:
  scopes:
    description: "Comma-separated list of changed app names"
    value: ${{ steps.detect.outputs.scopes }}
  has_changes:
    description: "Whether any apps have changes"
    value: ${{ steps.detect.outputs.has_changes }}

runs:
  using: "composite"
  steps:
    - name: Detect changed apps
      id: detect
      shell: bash
      run: |
        set -e

        echo "=========================================="
        echo "Detect Changed Apps"
        echo "=========================================="

        MANUAL_SCOPES="${{ inputs.manual_scopes }}"
        APPS_CONFIG="${{ inputs.apps_config }}"
        CHANGED_FILES="${{ inputs.changed_files }}"
        BASE_REF="${{ inputs.base_ref }}"

        # Manual scopes override
        if [ -n "$MANUAL_SCOPES" ]; then
          echo "Using manual scopes: $MANUAL_SCOPES"
          echo "scopes=$MANUAL_SCOPES" >> "$GITHUB_OUTPUT"
          echo "has_changes=true" >> "$GITHUB_OUTPUT"
          exit 0
        fi

        # Get changed files
        if [ -z "$CHANGED_FILES" ]; then
          if [ -z "$BASE_REF" ]; then
            if [ "${{ github.event_name }}" == "pull_request" ]; then
              BASE_REF="${{ github.event.pull_request.base.sha }}"
            else
              BASE_REF="HEAD~1"
            fi
          fi
          echo "Comparing against: $BASE_REF"
          CHANGED_FILES=$(git diff --name-only "$BASE_REF" HEAD 2>/dev/null || echo "")
        fi

        if [ -z "$CHANGED_FILES" ]; then
          echo "No changed files detected"
          echo "scopes=" >> "$GITHUB_OUTPUT"
          echo "has_changes=false" >> "$GITHUB_OUTPUT"
          exit 0
        fi

        # tj-actions/changed-files emits a space-separated list on a single line.
        # `grep -q "^X"` then only matches the first token — alphabetically first
        # files would win, the rest silently slip past. Normalize to one path per
        # line so the start-of-line anchor works for every changed file.
        CHANGED_FILES=$(echo "$CHANGED_FILES" | tr ' ' '\n' | sed '/^$/d')

        echo "Changed files:"
        echo "$CHANGED_FILES" | head -20
        if [ $(echo "$CHANGED_FILES" | wc -l) -gt 20 ]; then
          echo "... and more"
        fi
        echo ""

        # Read app names from config (pure bash, no yq dependency)
        APP_NAMES=$(grep -E '^\s+-\s+app:\s+' "$APPS_CONFIG" 2>/dev/null | sed 's/.*app:\s*//' | tr -d ' ' || echo "")
        if [ -z "$APP_NAMES" ]; then
          echo "No apps found in config"
          echo "scopes=" >> "$GITHUB_OUTPUT"
          echo "has_changes=false" >> "$GITHUB_OUTPUT"
          exit 0
        fi

        get_app_package_dependencies() {
          local target_app="$1"
          awk -v target_app="$target_app" '
            /^[[:space:]]*-[[:space:]]*app:[[:space:]]*/ {
              app = $NF
              gsub(/[[:space:]]/, "", app)
              in_target = (app == target_app)
              in_deps = 0
              next
            }

            in_target && /^[[:space:]]*packageDependencies:[[:space:]]*$/ {
              in_deps = 1
              next
            }

            in_target && in_deps && /^[[:space:]]*-[[:space:]]*/ {
              dep = $0
              sub(/^[[:space:]]*-[[:space:]]*/, "", dep)
              gsub(/[[:space:]]/, "", dep)
              if (dep != "") print dep
              next
            }

            in_target && in_deps && /^[[:space:]]*[[:alnum:]_-]+:[[:space:]]*/ {
              in_deps = 0
            }
          ' "$APPS_CONFIG"
        }

        # Workspace-global changes affect every app because cache keys, task graph,
        # dependency resolution, or root tooling can change beneath all packages.
        GLOBAL_CHANGED=false
        if echo "$CHANGED_FILES" | grep -qE "^(package\.json|pnpm-lock\.yaml|pnpm-workspace\.yaml|turbo\.json|\.nvmrc|\.oxfmtrc\.jsonc|\.oxlintrc\.json|scripts/)"; then
          GLOBAL_CHANGED=true
          echo "workspace/global config changed - will include all apps"
        fi

        # CI-related files affect all apps because they can change detection,
        # setup, cache, or validation behavior.
        CI_CHANGED=false
        if echo "$CHANGED_FILES" | grep -qE "^\.github/(workflows|actions|app-config)/"; then
          CI_CHANGED=true
          echo ".github CI files changed - will include all apps"
        fi

        CHANGED_PACKAGES=$(echo "$CHANGED_FILES" | sed -n 's#^packages/\([^/]*\)/.*#\1#p' | sort -u | tr '\n' ' ' | xargs || true)
        if [ -n "$CHANGED_PACKAGES" ]; then
          echo "Changed workspace packages: $CHANGED_PACKAGES"
        fi

        KNOWN_PACKAGE_DEPS=$(for APP in $APP_NAMES; do get_app_package_dependencies "$APP"; done | sort -u | tr '\n' ' ' | xargs || true)
        UNKNOWN_PACKAGE_CHANGED=false
        for PACKAGE in $CHANGED_PACKAGES; do
          if ! echo " $KNOWN_PACKAGE_DEPS " | grep -qF " $PACKAGE "; then
            UNKNOWN_PACKAGE_CHANGED=true
            echo "packages/${PACKAGE}/ is not mapped in $APPS_CONFIG - will include all apps"
          fi
        done

        # Detect affected apps
        AFFECTED=""
        for APP in $APP_NAMES; do
          APP_CHANGED=false
          PACKAGE_AFFECTED=false

          # Check if app directory changed
          if echo "$CHANGED_FILES" | grep -q "^apps/${APP}/"; then
            APP_CHANGED=true
          fi

          # Check if a changed workspace package is declared as a dependency of this app
          if [ -n "$CHANGED_PACKAGES" ]; then
            APP_PACKAGE_DEPS=$(get_app_package_dependencies "$APP" | tr '\n' ' ' | xargs || true)
            for PACKAGE in $CHANGED_PACKAGES; do
              if echo " $APP_PACKAGE_DEPS " | grep -qF " $PACKAGE "; then
                PACKAGE_AFFECTED=true
              fi
            done
          fi

          if [ "$GLOBAL_CHANGED" = true ] || [ "$CI_CHANGED" = true ] || [ "$UNKNOWN_PACKAGE_CHANGED" = true ] || [ "$APP_CHANGED" = true ] || [ "$PACKAGE_AFFECTED" = true ]; then
            if [ -n "$AFFECTED" ]; then
              AFFECTED="${AFFECTED},${APP}"
            else
              AFFECTED="$APP"
            fi
            echo "  [affected] $APP"
          fi
        done

        echo ""
        echo "Affected apps: ${AFFECTED:-none}"
        echo "=========================================="

        echo "scopes=$AFFECTED" >> "$GITHUB_OUTPUT"
        if [ -n "$AFFECTED" ]; then
          echo "has_changes=true" >> "$GITHUB_OUTPUT"
        else
          echo "has_changes=false" >> "$GITHUB_OUTPUT"
        fi
