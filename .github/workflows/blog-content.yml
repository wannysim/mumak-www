name: Blog Content Validation

on:
  pull_request:
    # Keep PR trigger unfiltered so the `Validate Blog Content` required check
    # is always created when the ruleset requires it. Non-content changes are
    # skipped inside the job (see the changed-files gate below).
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main, develop]
    paths:
      - "apps/blog/content/**"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-content:
    name: Validate Blog Content
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Get changed content files
        id: changed-files
        if: github.event_name == 'pull_request'
        uses: tj-actions/changed-files@v47
        with:
          files: apps/blog/content/**

      - name: Setup Node.js and pnpm
        if: github.event_name != 'pull_request' || steps.changed-files.outputs.any_changed == 'true'
        uses: ./.github/actions/setup-node-pnpm
        with:
          save-cache: "false"

      - name: Validate content
        if: github.event_name != 'pull_request' || steps.changed-files.outputs.any_changed == 'true'
        run: pnpm --filter=blog validate:content -- --summary >> "$GITHUB_STEP_SUMMARY"

      - name: Skip notice
        if: github.event_name == 'pull_request' && steps.changed-files.outputs.any_changed != 'true'
        run: echo "No blog content changes - validation skipped." >> "$GITHUB_STEP_SUMMARY"
