name: Maestro Native E2E

# 네이티브 런타임(실제 빌드) 위에서 도는 Maestro 스모크.
#
# 웹 E2E(e2e.yml, Playwright)와 인프라가 완전히 다르다(Android 에뮬레이터 필요)므로 별도 워크플로우로 둔다.
# EAS 계정 없이 `expo prebuild` + Gradle 디버그 APK로 빌드한다.
#
# 게이팅(의도적으로 보수적):
#   - PR 필수 체크가 아니다. 콜드 빌드 + 에뮬레이터로 ~15-20분이 걸리고, 첫 실행 검증 전이다.
#   - 수동 실행(workflow_dispatch) + main에 네이티브 변경이 push될 때만 돈다.
#   - 안정화되면 pull_request 트리거와 branch protection 편입을 검토한다.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "apps/mumak-native/**"
      - "packages/shared/**"
      - "pnpm-lock.yaml"
      - ".github/workflows/maestro.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-smoke:
    name: Android Smoke (Maestro)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js and pnpm
        uses: ./.github/actions/setup-node-pnpm

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # KVM 가속이 있어야 에뮬레이터가 현실적인 속도로 부팅된다.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Install Maestro CLI
        uses: mobile-dev-inc/action-maestro-cli@v1

      # expo prebuild로 android/ 네이티브 프로젝트를 생성한다(리포에는 gitignore됨).
      - name: Prebuild Android project
        working-directory: apps/mumak-native
        run: pnpm exec expo prebuild --platform android --no-install

      # 디버그 APK. 디버그 빌드는 Metro에서 JS 번들을 받으므로, 테스트 동안 Metro를 띄워 둔다.
      - name: Build debug APK
        working-directory: apps/mumak-native/android
        run: ./gradlew :app:assembleDebug --no-daemon

      - name: Start Metro bundler
        working-directory: apps/mumak-native
        run: |
          pnpm exec expo start --no-dev --minify > "$RUNNER_TEMP/metro.log" 2>&1 &
          echo "metro_pid=$!" >> "$GITHUB_ENV"

      # 에뮬레이터를 부팅하고, APK 설치 → adb reverse(Metro 연결) → Maestro 스모크 실행을 script로 수행한다.
      - name: Run Maestro smoke on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            adb install -r apps/mumak-native/android/app/build/outputs/apk/debug/app-debug.apk
            adb reverse tcp:8081 tcp:8081
            maestro test apps/mumak-native/maestro/

      - name: Stop Metro
        if: always()
        run: kill "${metro_pid}" 2>/dev/null || true

      - name: Upload Maestro artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maestro-native-report
          path: ~/.maestro/tests/**
          if-no-files-found: ignore
          retention-days: 7
