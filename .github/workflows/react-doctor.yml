# React Doctor — finds security, performance, correctness, accessibility,
# bundle-size, and architecture issues in React codebases.
#
# Docs: https://www.react.doctor/docs/ci-and-prs/github-actions-setup
# Source: https://github.com/millionco/react-doctor
#
# CI v2: on pull_request the scan compares against the base branch and reports
# only the issues the change introduces; on push it runs a full-project scan
# for a health-score trend. See migration guide:
# https://www.react.doctor/docs/ci-and-prs/migrating-to-ci-v2

name: React Doctor

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  # Scans `main` on every push so you get a health-score trend on the
  # default branch — useful for tracking the overall number commit-by-commit
  # and catching regressions that slipped past PR review. PR-specific steps
  # (the sticky summary comment) are skipped automatically on `push` events.
  # With `blocking: error` this run gates merges on error-severity findings.
  # The former 3-error baseline is cleared (B-6): two were genuine fixes in
  # code (mumak-native color-scheme hooks — unconditional hook hoisted out of a
  # ternary, web hydration moved to useSyncExternalStore), and one structural
  # OAuth false positive is downgraded to `warn` in doctor.config.json.
  # Comment this block out if you only want PR-time scans.
  push:
    branches: [main]

permissions:
  # `actions/checkout` needs this to read the repo source.
  contents: read
  # `review-comments: true` posts inline review comments on the changed lines
  # that triggered a diagnostic. Downgrade `write` to `read` to keep the
  # changed-file scan but disable inline review comments.
  pull-requests: write
  # `comment: true` posts/updates the sticky React Doctor summary via GitHub's
  # `issues.createComment` / `issues.updateComment` endpoints (PRs are issues
  # under the hood). Not exercised on `push` events, so safe to drop if you
  # only run on `main`.
  issues: write

# Cancels any in-flight scan for the same PR (or branch, on push) the moment
# a new commit arrives, so reviewers only ever see the latest run.
concurrency:
  group: react-doctor-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  react-doctor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # v2 compares a PR against its base branch, so it needs full history.
          fetch-depth: 0

      # Floating `@v2` always resolves to the latest `v2.x` release, so patches
      # and new features land automatically without breaking changes. The docs
      # recommend SHA pinning for hardened CI when the workflow has
      # `pull-requests: write` — revisit (pin + Dependabot/Renovate) once this
      # action is part of the merge gate.
      - uses: millionco/react-doctor@v2
        with:
          # Gating mode: error-severity findings fail the run. Baseline cleared
          # in B-6 (see push comment above). The one unavoidable false positive
          # — nextjs-no-side-effect-in-get-handler on the Spotify OAuth GET
          # callback — is downgraded to `warn` in doctor.config.json: the rule
          # can't be scoped per-file, and an OAuth redirect must be GET (CSRF is
          # mitigated by single-use `state` + no-store, see C-8). Consider
          # `blocking: warning` only if the team agrees to gate on warnings too.
          blocking: error
          # Sticky PR summary comment (issue counts, score, change metrics).
          comment: true
          # Inline review comments on changed lines, each with a suggested fix.
          review-comments: true
          # Monorepo: scan every workspace project. `scope` defaults to
          # `changed` on PRs (diff-scoped) and `full` on push, which matches
          # the "PR = new issues / push = baseline trend" intent, so both are
          # left at their defaults.
          project: "*"
        # Other knobs (defaults shown) — uncomment to override:
        #   scope: changed     # "changed" (PR default) | "full" (push default)
        #   directory: "."     # Scan a sub-directory
        #   version: latest    # Pin a specific react-doctor CLI version
