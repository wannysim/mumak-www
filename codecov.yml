# Codecov 설정
# - 변동 없는 PR에는 코멘트 안 달리도록 (require_changes: true)
# - 새/변경된 라인은 80%+ 커버리지 권장 (patch.target)
# - 앱별 flag는 PR 코멘트/Codecov UI에서 분리하되 status check는 전역 project/patch만 노출
# 참고: https://docs.codecov.com/docs/codecov-yaml

codecov:
  require_ci_to_pass: true
  notify:
    wait_for_ci: true

coverage:
  precision: 2
  round: down
  range: '70...90'
  status:
    project:
      default:
        target: auto
        threshold: 1%
        if_ci_failed: error
    patch:
      default:
        target: 80%
        threshold: 0%
        if_ci_failed: error

comment:
  layout: 'header, diff, flags, files, footer'
  behavior: default
  require_changes: true
  require_base: false
  require_head: true

# 앱별 커버리지는 flag로 분리해 PR 코멘트와 Codecov UI에서 추적한다.
# GitHub Checks 노이즈를 줄이기 위해 per-flag status는 만들지 않고,
# 전역 `codecov/project`, `codecov/patch` status만 유지한다.
flag_management:
  default_rules:
    carryforward: true
  individual_flags:
    - name: blog
      paths:
        - apps/blog/src/
    - name: mumak-next
      paths:
        - apps/mumak-next/components/
    - name: mumak-react
      paths:
        - apps/mumak-react/src/
    - name: mumak-native
      paths:
        - apps/mumak-native/components/
        - apps/mumak-native/hooks/
        - apps/mumak-native/constants/

# 커버리지 측정에서 제외할 경로 (테스트 파일, 설정, 외부 래퍼 등)
ignore:
  - '**/__tests__/**'
  - '**/*.d.ts'
  - '**/*.test.{ts,tsx,js,jsx}'
  - '**/*.spec.{ts,tsx,js,jsx}'
  - 'apps/blog/app/**'
  - 'apps/blog/src/shared/config/**'
  - 'apps/blog/src/app/analytics/**'
  - 'apps/mumak-next/app/**'
  - 'apps/mumak-next/components/providers.tsx'
  - 'apps/mumak-react/src/main.tsx'
  - 'apps/mumak-react/src/test/**'
  - 'apps/mumak-native/app/**'
  - 'apps/mumak-native/scripts/**'
  - '**/scripts/**'
  - 'packages/ui/**'
